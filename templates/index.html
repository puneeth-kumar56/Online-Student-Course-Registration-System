<!DOCTYPE html>
<html>
<head>
    <title>Online Course Registration</title>
</head>
<body>

<h2>Online Student Course Registration System</h2>

<h3>Available Courses</h3>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Course Name</th>
    <th>Duration</th>
    <th>Action</th>
</tr>

{% for course in courses %}
<tr>
    <td>{{ course.id }}</td>
    <td>{{ course.course_name }}</td>
    <td>{{ course.duration }}</td>
    <td>
        <a href="/register/{{ course.id }}">Register</a>
    </td>
</tr>
{% endfor %}

</table>

<br>

<a href="/registrations">View Registrations</a>

</body>
</html>

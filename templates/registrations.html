<!DOCTYPE html>
<html>
<head>
    <title>Registered Students</title>
</head>
<body>

<h2>Registered Students</h2>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Student Name</th>
    <th>Email</th>
    <th>Course</th>
</tr>

{% for record in records %}
<tr>
    <td>{{ record.id }}</td>
    <td>{{ record.student_name }}</td>
    <td>{{ record.email }}</td>
    <td>{{ record.course_name }}</td>
</tr>
{% endfor %}

</table>

<br>

<a href="/">Back to Home</a>

</body>
</html>
